services:
  - type: web
    name: hotel-booking-system
    runtime: python
    plan: free
    pythonVersion: 3.11
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput --clear &&
      python manage.py migrate
    startCommand: "gunicorn hotel_booking_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --worker-class sync --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
